services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.nas
    volumes:
      - ./nas-data/postgres:/var/lib/postgresql/data
      - ./nas/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [gefriertruhe-intern]

  app:
    build: .
    restart: unless-stopped
    env_file: .env.nas
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8787:8000"
    volumes:
      - ./migration:/migration:ro
    networks: [gefriertruhe-intern]

networks:
  gefriertruhe-intern:
    driver: bridge
