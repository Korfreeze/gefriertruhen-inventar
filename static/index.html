<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b6e69"><meta name="apple-mobile-web-app-capable" content="yes"><title>Gefriertruhe</title><link rel="manifest" href="/static/manifest.webmanifest"><link rel="stylesheet" href="/static/styles.css"><link rel="stylesheet" href="/static/icons.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<header><div><span class="eyebrow">MEIN VORRAT</span><h1>Gefriertruhe</h1></div><button id="logout" class="secondary hidden">Abmelden</button></header><main><div id="notice" class="notice hidden"></div>
<section id="auth" class="card narrow"><h2>Willkommen</h2><p>Melde dich für euren gemeinsamen Bestand an.</p><form id="auth-form"><label>E-Mail<input id="email" type="email" required></label><label>Passwort<input id="password" type="password" minlength="6" required></label><button>Anmelden</button></form><button id="signup" class="hidden" tabindex="-1">Neues Konto anlegen</button></section>
<section id="app" class="hidden"><div class="toolbar"><select id="freezer"></select><button id="new-freezer" class="secondary">+ Truhe</button><span class="live">● live</span></div><div id="empty" class="card hidden"><h2>Erste Gefriertruhe anlegen</h2><label>Name<input id="freezer-name" value="Gefriertruhe Keller" maxlength="120"></label><button id="empty-create">Jetzt anlegen</button></div>
<div id="inventory" class="hidden"><div class="summary"><div><span>Positionen</span><strong id="count">0</strong></div><div><span>Gesamtmenge</span><strong id="total">0</strong></div></div><div class="actions"><input id="search" type="search" placeholder="Bestand durchsuchen …"><button id="show-location" class="secondary">+ Fach</button><button id="show-form">+ Lebensmittel</button></div>
<form id="location-form" class="card hidden"><h2>Fach oder Korb anlegen</h2><label>Name<input id="location-name" required placeholder="z. B. Oberer Korb" maxlength="120"></label><button>Speichern</button> <button type="button" id="cancel-location" class="secondary">Abbrechen</button></form>
<form id="item-form" class="card hidden"><h2 id="item-form-title">Lebensmittel hinzufügen</h2><div class="grid"><label>Name<input id="name" required></label><label>Kategorie<input id="category" placeholder="z. B. Gemüse"></label><label>Menge<input id="quantity" type="number" min="0" step="0.1" value="1" required></label><label>Einheit<select id="unit"><option>Stück</option><option>Packung</option><option>kg</option><option>g</option><option>Liter</option></select></label><label>Fach<select id="location"><option value="">Ohne Fach</option></select></label><label>Eingefroren am<input id="frozen-at" type="date"></label></div><button id="item-submit">Speichern</button> <button type="button" id="cancel" class="secondary">Abbrechen</button></form><div id="items" class="items"></div></div></section></main>
<template id="item-template"><article class="item"><div><span class="category"></span><h3></h3><select class="item-location" aria-label="Lagerort ändern"></select></div><div class="stepper"><button data-change="-1">−</button><strong></strong><button data-change="1">+</button></div><div class="item-actions"><button class="edit secondary icon-button" aria-label="Bearbeiten" title="Bearbeiten">✎</button><button class="delete secondary icon-button" aria-label="Löschen" title="Löschen">🗑</button></div></article></template><script src="/static/app.js"></script></body></html>
