<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b6e69"><meta name="apple-mobile-web-app-capable" content="yes"><title>Gefriertruhe</title><link rel="manifest" href="/static/manifest.webmanifest"><link rel="stylesheet" href="/static/styles.css"><link rel="stylesheet" href="/static/icons.css"><link rel="stylesheet" href="/static/barcode.css"><link rel="stylesheet" href="/static/quantity.css"><link rel="stylesheet" href="/static/shopping.css"><link rel="stylesheet" href="/static/locations.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<header><div><span class="eyebrow">MEIN VORRAT</span><h1>Gefriertruhe</h1></div><button id="logout" class="secondary hidden">Abmelden</button></header><main><div id="notice" class="notice hidden"></div>
<section id="auth" class="card narrow"><h2>Willkommen</h2><p>Melde dich für euren gemeinsamen Bestand an.</p><form id="auth-form"><label>E-Mail<input id="email" type="email" required></label><label>Passwort<input id="password" type="password" minlength="6" required></label><button>Anmelden</button></form><button id="signup" class="hidden" tabindex="-1">Neues Konto anlegen</button></section>
<section id="app" class="hidden"><nav class="view-tabs"><button id="inventory-tab">❄ Bestand</button><button id="shopping-tab" class="secondary">🛒 Einkauf <span id="shopping-count"></span></button></nav><div id="inventory-view"><div class="toolbar"><select id="freezer"></select><button id="export-pdf" class="secondary">PDF Export</button><button id="backup-json" class="secondary">Datensicherung</button><button id="new-freezer" class="secondary">+ Truhe</button><span class="live">● live</span></div><div id="empty" class="card hidden"><h2>Erste Gefriertruhe anlegen</h2><label>Name<input id="freezer-name" value="Gefriertruhe Keller" maxlength="120"></label><button id="empty-create">Jetzt anlegen</button></div>
<div id="inventory" class="hidden"><div class="summary"><div><span>Positionen</span><strong id="count">0</strong></div><div><span>Gesamtmenge</span><strong id="total">0</strong></div></div><div class="actions"><input id="search" type="search" placeholder="Bestand durchsuchen …"><select id="category-filter" aria-label="Nach Kategorie filtern"><option value="">Alle Kategorien</option></select><select id="sort-items" aria-label="Bestand sortieren"><option value="name">A–Z</option><option value="category">Kategorie</option><option value="location">Lagerort</option><option value="newest">Neueste zuerst</option></select><button id="show-location" class="secondary">+ Fach</button><button id="show-form">+ Lebensmittel</button></div>
<form id="location-form" class="card hidden"><h2>Fächer und Körbe verwalten</h2><label>Neues Fach<input id="location-name" required placeholder="z. B. Oberer Korb" maxlength="120"></label><button>+ Anlegen</button> <button type="button" id="cancel-location" class="secondary">Schließen</button><div id="location-manager" class="location-manager"></div></form>
<form id="item-form" class="card hidden"><h2 id="item-form-title">Lebensmittel hinzufügen</h2><div class="barcode-row"><label>Barcode<input id="barcode" inputmode="numeric" autocomplete="off" placeholder="Scannen oder eingeben"></label><button type="button" id="scan-barcode" class="secondary">▣ Scannen</button><button type="button" id="lookup-barcode" class="secondary">Suchen</button></div><div class="grid"><label>Name<input id="name" required></label><label>Kategorie<input id="category" placeholder="z. B. Gemüse"></label><label>Menge<input id="quantity" type="number" min="0" step="0.1" value="1" required></label><label>Einheit<select id="unit"><option>Stück</option><option>Packung</option><option>kg</option><option>g</option><option>Liter</option></select></label><label>Fach<select id="location"><option value="">Ohne Fach</option></select></label><label>Eingefroren am<input id="frozen-at" type="date"></label></div><button id="item-submit">Speichern</button> <button type="button" id="cancel" class="secondary">Abbrechen</button></form><div id="scanner" class="card hidden"><h2>Barcode scannen</h2><div id="reader"></div><button type="button" id="close-scanner" class="secondary">Kamera schließen</button></div><div id="items" class="items"></div></div></div><section id="shopping-view" class="hidden"><form id="shopping-form" class="card shopping-form"><h2>Einkaufsliste</h2><div class="shopping-add"><input id="shopping-name" required placeholder="Was wird benötigt?"><input id="shopping-quantity" type="number" min="0" step="0.1" value="1" required><select id="shopping-unit"><option>Stück</option><option>Packung</option><option>kg</option><option>g</option><option>Liter</option></select><button>+ Hinzufügen</button></div></form><div id="shopping-items" class="shopping-items"></div></section></section></main>
<template id="item-template"><article class="item"><div><span class="category"></span><h3></h3><select class="item-location" aria-label="Lagerort ändern"></select></div><div class="stepper"><button data-change="-1" aria-label="Menge verringern">−</button><label class="quantity-label"><input class="quantity-direct" type="number" min="0" inputmode="decimal" aria-label="Menge direkt eingeben"><span class="quantity-unit"></span></label><button data-change="1" aria-label="Menge erhöhen">+</button></div><div class="item-actions"><button class="cart secondary icon-button" aria-label="Zur Einkaufsliste" title="Zur Einkaufsliste">🛒</button><button class="edit secondary icon-button" aria-label="Bearbeiten" title="Bearbeiten">✎</button><button class="delete secondary icon-button" aria-label="Löschen" title="Löschen">🗑</button></div></article></template><template id="shopping-template"><article class="shopping-item"><input class="shopping-check" type="checkbox" aria-label="Erledigt"><div><h3></h3><small></small></div><input class="shopping-amount" type="number" min="0" step="0.1" aria-label="Menge"><button class="shopping-delete secondary icon-button" aria-label="Löschen">🗑</button></article></template><template id="location-template"><article class="location-row"><input class="location-edit" maxlength="120"><small></small><div><button type="button" class="location-up secondary icon-button" title="Nach oben">↑</button><button type="button" class="location-down secondary icon-button" title="Nach unten">↓</button><button type="button" class="location-save secondary icon-button" title="Umbenennen">✓</button><button type="button" class="location-delete secondary icon-button" title="Löschen">🗑</button></div></article></template><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script src="/static/app.js"></script><script src="/static/barcode.js"></script><script src="/static/locations.js"></script><script src="/static/shopping.js"></script></body></html>
